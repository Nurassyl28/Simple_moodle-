server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Одностраничное приложение: любой путь отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Фронт и API отдаются с одного адреса — иначе браузер считает их разными
    # источниками и не отправляет cookie с сессией.
    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ограничитель попыток входа считает по адресу — без этого все студенты
        # выглядели бы как один клиент.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
