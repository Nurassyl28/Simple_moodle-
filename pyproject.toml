# Настройки инструментов разработки. Сами сервисы собираются своими Dockerfile.

[tool.pytest.ini_options]
# Чтобы тесты видели общий пакет и код сервисов без установки: pytest из корня.
# Пакеты сервисов названы по-разному (auth_app, moodle_app) — иначе одинаковый
# "app" в нескольких сервисах давал бы коллизию при импорте в тестах.
pythonpath = ["shared", "services/auth", "services/moodle", "services/tracker"]
testpaths = ["shared/tests", "services"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
