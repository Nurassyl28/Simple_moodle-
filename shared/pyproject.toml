[project]
name = "sduhub-common"
version = "0.1.0"
description = "Общий код микросервисов SDU Hub: конфиг, пул Postgres, шифрование токенов, логи без секретов"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "cryptography>=44.0.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sduhub_common"]
